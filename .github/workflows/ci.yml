name: Validate course
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install course and optional demo
        run: uv sync --group dev --group demo
      - name: Run automated tests
        run: uv run pytest -q
      - name: Execute seven notebooks
        run: uv run python scripts/validate_notebooks.py
      - name: Lint Python code
        run: uv run ruff check src tests scripts examples

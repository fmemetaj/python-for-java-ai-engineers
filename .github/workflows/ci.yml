name: Validate course
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install course and optional demo
        run: uv sync --locked --group dev --group demo
      - name: Run automated tests
        run: uv run pytest -q
      - name: Execute seven notebooks
        run: uv run python scripts/validate_notebooks.py
      - name: Lint Python code
        run: uv run ruff check src tests scripts examples
      - name: Check formatting
        run: uv run ruff format --check src tests scripts examples
      - name: Type check (non-blocking)
        continue-on-error: true
        run: uv run pyright

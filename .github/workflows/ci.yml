name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  checks:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install (locked, including optional demo)
        run: uv sync --locked --group dev --group demo
      - name: Ruff lint
        run: uv run ruff check src tests scripts examples concepts placement fundamentals
      - name: Ruff format
        run: uv run ruff format --check src tests scripts examples concepts placement fundamentals
      - name: Pyright
        run: uv run pyright
      - name: Compile Java snippets
        run: uv run python scripts/compile_java_snippets.py
      - name: Pytest
        run: uv run pytest -q
      - name: Register Jupyter kernel
        run: uv run python -m ipykernel install --user --name python3 --display-name "Python 3"
      - name: Execute notebooks
        run: uv run pytest --nbmake --nbmake-timeout=120 notebooks/ concepts/0_02/hidden_state.ipynb

  default-dev-install:
    name: default uv sync --group dev (no Gradio)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install default course tools
        run: uv sync --locked --group dev
      - name: Pytest without Gradio
        run: uv run pytest -q
      - name: Doctor (offline)
        run: uv run python scripts/doctor.py --offline
      - name: Module 0A solutions checkpoint
        run: uv run course check m0a --solutions

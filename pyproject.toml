[project]
name = "python-for-java-ai-engineers"
version = "0.1.0"
description = "60-minute Python bridge for experienced Java developers entering AI engineering"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["pydantic>=2.10,<3"]

[dependency-groups]
dev = ["ipykernel>=6.29,<7", "jupyterlab>=4.3,<5", "nbclient>=0.10,<1", "nbformat>=5.10,<6", "pytest>=8.3,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4","E7","E9","F"]

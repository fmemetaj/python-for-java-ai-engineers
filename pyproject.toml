[project]
name = "python-for-java-ai-engineers"
version = "0.2.0"
description = "Python bridge for Java developers, with an optional local AI demo"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["pydantic>=2.10,<3"]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.3,<5",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "nbmake>=1.5,<2",
    "pyright>=1.1.400,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]
demo = ["gradio>=5.0,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "nbmake: notebook execution via nbmake (used by pytest --nbmake)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["src", "tests", "scripts", "examples"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"

[project]
name = "python-for-java-ai-engineers"
version = "0.2.0"
description = "Estimated one-hour Python bridge for Java developers, with an optional local AI demo"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["pydantic>=2.10,<3"]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.3,<5",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "pyright>=1.1,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]
demo = ["gradio>=5.0,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["src", "tests", "scripts", "examples"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

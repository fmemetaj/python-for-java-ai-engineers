[project]
name = "python-for-java-ai-engineers"
version = "0.7.0"
description = "Python bridge for Java developers, with an optional local AI demo"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "httpx>=0.27,<1",
    "numpy>=2.0,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
course = "course_kit.cli:main"
docsdesk = "docsdesk.__main__:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.3,<5",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "nbmake>=1.5,<2",
    "pyright>=1.1.400,<2",
    "pytest>=8.3,<10",
    "respx>=0.21,<1",
    "ruff>=0.9,<1",
]
demo = ["gradio>=5.0,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent", "src/course_kit", "src/docsdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "nbmake: notebook execution via nbmake (used by pytest --nbmake)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "examples", "concepts", "placement", "fundamentals"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["src", "tests", "scripts", "examples", "concepts", "placement", "fundamentals"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
